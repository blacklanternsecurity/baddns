identifiers:
  cnames:
  - type: word
    value: amazonaws.com
  ips: []
  nameservers: []
  not_cnames:
  - type: word
    value: -an.s3.
matcher_rule:
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - The specified bucket does not exist
    - BucketName
  - status: 404
    type: status
  matchers-condition: and
mode: http
service_name: AWS Bucket Takeover Detection
source: self
