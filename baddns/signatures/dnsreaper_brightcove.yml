identifiers:
  cnames:
  - type: word
    value: bcvp0rtal.com
  - type: word
    value: brightcovegallery.com
  - type: word
    value: gallery.video
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - Sorry, we can't find the page you requested
    - 'Error Code: 404'
  - status: 404
    type: status
  matchers-condition: and
mode: http
service_name: BrightCove
source: dnsreaper
