identifiers:
  cnames:
  - type: word
    value: read.uberflip.com
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - Non-hub domain
    - The URL you've accessed does not provide a hub.
  - status: 404
    type: status
  matchers-condition: and
mode: http
service_name: Uberflip Takeover Detection
source: nucleitemplates
