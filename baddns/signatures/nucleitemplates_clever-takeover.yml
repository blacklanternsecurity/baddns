identifiers:
  cnames:
  - type: word
    value: clever-cloud.com
  - type: word
    value: cleverapps.io
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: or
    part: body
    type: word
    words:
    - The application you're trying to access doesn't seem to exist
  - status: 404
    type: status
  matchers-condition: and
mode: http
service_name: Clever Cloud - Subdomain Takeover Detection
source: nucleitemplates
