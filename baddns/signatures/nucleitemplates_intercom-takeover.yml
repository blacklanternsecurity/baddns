identifiers:
  cnames:
  - type: word
    value: custom.intercom.help
  - type: word
    value: custom.eu.intercom.help
  - type: word
    value: custom.au.intercom.help
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - status: 404
    type: status
  - condition: and
    part: body
    regex:
    - ^Not found\s*$
    type: regex
  - condition: or
    part: header
    type: word
    words:
    - x-intercom-version
  matchers-condition: and
mode: http
service_name: Intercom Takeover Detection
source: self
