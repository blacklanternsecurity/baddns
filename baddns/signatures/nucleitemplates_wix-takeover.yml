identifiers:
  cnames:
  - type: word
    value: .wix.com
  - type: word
    value: .wixdns.net
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - dsl:
    - Host != ip
    type: dsl
  - condition: and
    part: body
    type: word
    words:
    - ConnectYourDomain Error | Wix.com
  - status: 404
    type: status
  - condition: or
    dsl:
    - '!contains(host,".wix.com")'
    - '!contains(host,".wixdns.net")'
    type: dsl
  matchers-condition: and
mode: http
negative_signature: false
service_name: Wix Takeover Detection
source: nucleitemplates
