identifiers:
  cnames:
  - type: word
    value: cname.short.io
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: or
    part: body
    type: word
    words:
    - This domain is not configured for link redirection.
  - status: 404
    type: status
  matchers-condition: and
mode: http
service_name: short
source: dnsreaper
