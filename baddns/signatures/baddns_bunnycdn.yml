identifiers:
  cnames:
  - type: word
    value: b-cdn.net
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - Domain suspended or not configured
    - BunnyCDN
  - status: 403
    type: status
  matchers-condition: and
mode: http
service_name: Bunny CDN Takeover Detection
source: self
