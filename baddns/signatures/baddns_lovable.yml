identifiers:
  cnames:
  - type: word
    value: lovable.app
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - status: 404
    type: status
  - condition: and
    part: body
    type: word
    words:
    - No Lovable project found at this address.
  matchers-condition: and
mode: http
service_name: Lovable Takeover Detection
source: self
