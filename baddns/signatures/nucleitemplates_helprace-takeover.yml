identifiers:
  cnames:
  - type: word
    value: helprace.com
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - status: 301
    type: status
  - condition: and
    part: header
    regex:
    - ^https?://helprace\.com/?$
    - ^Helprace$
    type: regex
  matchers-condition: and
mode: http
service_name: Helprace Takeover Detection
source: self
