identifiers:
  cnames:
  - type: word
    value: target.substack-custom-domains.com
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: or
    part: body
    type: word
    words:
    - 'error code: 1001'
    - 'error code: 1014'
  matchers-condition: and
mode: http
service_name: Substack Takeover Detection
source: self
