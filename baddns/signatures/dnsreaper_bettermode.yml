identifiers:
  cnames:
  - type: word
    value: domains.bettermode.io
  ips: []
  nameservers: []
  not_cnames: []
matcher_rule:
  matchers:
  - condition: or
    part: body
    type: word
    words:
    - 'error code: 1001'
  - status: 409
    type: status
  matchers-condition: and
mode: http
service_name: bettermode.com
source: dnsreaper
